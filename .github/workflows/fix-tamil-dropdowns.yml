name: Fix Tamil Dropdown Options
on:
  push:
    branches: [main]
jobs:
  update:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Update dropdown translations
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'function applyLanguage(){document.documentElement.lang=language;document.querySelectorAll("[data-i18n]").forEach(el=>{const k=el.dataset.i18n;if(T[language][k])el.textContent=T[language][k]});document.getElementById("langBtn").textContent=language==="en"?"தமிழ்":"English"}'
          new = '''function translateOptions(){const maps={purpose:{all:["Any","எதுவும்"],Buy:["Buy","வாங்க"],Rent:["Rent","வாடகைக்கு"],Sell:["Sell","விற்க"]},ptype:{all:["Any property","எந்த சொத்தும்"],"Residential Plot":["Residential Plot","குடியிருப்பு மனை"],House:["House","வீடு"],Apartment:["Apartment","அடுக்குமாடி குடியிருப்பு"],Villa:["Villa","வில்லா"],"Agricultural Land":["Agricultural Land","விவசாய நிலம்"],"Commercial Property":["Commercial Property","வணிக சொத்து"],"Industrial Property":["Industrial Property","தொழிற்சாலை சொத்து"],Other:["Other","மற்றவை"]},req:{Buy:["Buy","வாங்க"],Rent:["Rent","வாடகைக்கு"],"Sell my property":["Sell my property","என் சொத்தை விற்க"],"Site Visit":["Site Visit","நேரில் பார்வையிட"]},enqtype:{"Residential Plot":["Residential Plot","குடியிருப்பு மனை"],House:["House","வீடு"],Apartment:["Apartment","அடுக்குமாடி குடியிருப்பு"],Villa:["Villa","வில்லா"],"Agricultural Land":["Agricultural Land","விவசாய நிலம்"],"Commercial Property":["Commercial Property","வணிக சொத்து"],"Industrial Property":["Industrial Property","தொழிற்சாலை சொத்து"],Other:["Other","மற்றவை"]}};Object.entries(maps).forEach(([id,map])=>{const el=document.getElementById(id);if(!el)return;[...el.options].forEach(o=>{const m=map[o.value]||map[o.text];if(m)o.textContent=language==="ta"?m[1]:m[0]})})}
function applyLanguage(){document.documentElement.lang=language;document.querySelectorAll("[data-i18n]").forEach(el=>{const k=el.dataset.i18n;if(T[language][k])el.textContent=T[language][k]});translateOptions();document.getElementById("langBtn").textContent=language==="en"?"தமிழ்":"English"}'''
          if old not in s:
              raise SystemExit('Target applyLanguage function not found')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
      - name: Commit update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix Tamil dropdown options [skip ci]'
          git push
