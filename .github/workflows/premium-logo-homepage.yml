name: KL Real Estate Premium Homepage

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  theme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const path = 'index.html';
            const r = await github.rest.repos.getContent({owner: context.repo.owner, repo: context.repo.repo, path, ref: 'main'});
            let html = Buffer.from(r.data.content, 'base64').toString('utf8');
            const marker = 'premium-kl-home-final';
            if (html.includes(marker)) { console.log('Theme already present'); return; }
            const css = `
/* ${marker} */
:root{--navy:#1c3150;--navy2:#0e2747;--gold:#c39a4b}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:#fff;color:#172a42}
header{background:#fff;border-bottom:1px solid #e6e9ee;box-shadow:0 3px 18px rgba(20,42,66,.06)}
.brand img{width:225px;height:68px;object-fit:contain}.links{gap:27px;color:var(--navy)}.links a:hover{color:var(--gold)}
.lang{border:1px solid #d8dee6;color:var(--navy);border-radius:28px;padding:10px 16px}.navbtn{background:linear-gradient(135deg,#a97d2e,#cda85d);color:#fff;border-radius:28px;padding:12px 20px}
.hero{padding:0;background:#fff;overflow:visible}.hero .container{max-width:none;padding:0}.hero-wrap{min-height:570px;border-radius:0;background-image:linear-gradient(90deg,rgba(255,255,255,.98),rgba(255,255,255,.9) 34%,rgba(255,255,255,.25) 63%,rgba(255,255,255,.03)),url("hero.svg");background-size:cover;background-position:center;padding:72px max(6vw,32px)}
.eyebrow{color:var(--gold)}.eyebrow:before{background:var(--gold)}.hero h1{font-family:Georgia,"Times New Roman",serif;color:var(--navy2);font-size:clamp(44px,5.5vw,70px)}.hero h1 span{color:var(--gold)}.hero p{color:#40516a}
.primary{background:linear-gradient(135deg,#ad8030,#c9a45a);box-shadow:0 9px 22px rgba(173,128,48,.22)}.secondary{color:var(--navy);border-color:#d8dee6}.hero-point{color:var(--navy)}.hero-point b{color:var(--gold)}
.stats{margin-top:-34px}.stats-grid{border-top:4px solid var(--gold);box-shadow:0 18px 50px rgba(19,43,70,.12);border-radius:18px}.stat b{color:var(--navy);font-family:Georgia,serif}
.quick{background:#fff}.quick-btn{color:var(--navy);border-color:#e0e5eb}.quick-btn:nth-child(odd){background:#fbf8f1}.quick-btn:nth-child(even){background:#f2f5f8}.quick-btn:hover{border-color:var(--gold)}
.search{background:#fff}.searchbox{border-color:#dfe5eb;box-shadow:0 16px 38px rgba(17,42,70,.12);border-radius:18px}.field select:focus,.field input:focus,.field textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px #f7eedc}
section{padding:72px 0}.section-head h2{font-family:Georgia,"Times New Roman",serif;color:var(--navy2)}.cards{grid-template-columns:repeat(4,1fr)}.card{border-color:#e3e7ec;border-radius:18px;box-shadow:0 8px 28px rgba(18,45,72,.07)}.tag{color:var(--gold)}.price{color:var(--navy);font-family:Georgia,serif}.featured-badge{background:#f7efdf;color:#8f6828}
.category-band{background:linear-gradient(180deg,#fff,#f7f9fb)}.cat{background:#fff;border-color:#e0e5eb}.cat:nth-child(even){background:#f5f7fa}.cat:nth-child(3){background:#fbf7ee}.cat .ico{background:#f6eddb;color:var(--gold)}.cat strong{color:var(--navy)}
.about{background:linear-gradient(135deg,#f6f1e5,#eef3f8)}.about-card{background:rgba(255,255,255,.94);border-radius:24px}.check i{background:#f6eddb;color:#96702e}
.service-grid .service:nth-child(1),.service-grid .service:nth-child(4){background:#f7f1e3}.service-grid .service:nth-child(2),.service-grid .service:nth-child(5){background:#eef3f8}.service-grid .service:nth-child(3),.service-grid .service:nth-child(6){background:#fff}.service{border-color:#e0e5eb;border-radius:18px}.service .ico{color:var(--gold)}
.enquiry-layout{max-width:1050px;background:linear-gradient(135deg,#f4f7fa,#fbf5e8);padding:30px;border-radius:26px}.form{border-radius:22px}.tracking{background:linear-gradient(135deg,#eef3f8,#f8f1e2);border:1px solid #e0e5eb}.admin-section{background:#f5f7f9}.contact{background:linear-gradient(135deg,#fff,#f0f4f8)}.contact-info{background:linear-gradient(145deg,#0e2747,#1c3150);border-radius:24px}.contact-form{background:#fff}
footer{background:linear-gradient(135deg,#0e2747,#1c3150 72%,#8f6a2d 160%)}footer h3{font-family:Georgia,serif}
@media(max-width:1050px){.cards{grid-template-columns:1fr 1fr}.quick-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:650px){.brand img{width:180px}.hero-wrap{min-height:610px;padding:45px 24px;background-image:linear-gradient(180deg,rgba(255,255,255,.97),rgba(255,255,255,.78) 57%,rgba(255,255,255,.18)),url("hero.svg")}.hero h1{font-size:44px}.cards{grid-template-columns:1fr}.categories{grid-template-columns:1fr 1fr}.quick-grid{grid-template-columns:repeat(2,1fr)}}
`;
            html = html.replace('</style>', css + '\n</style>');
            await github.rest.repos.createOrUpdateFileContents({owner: context.repo.owner, repo: context.repo.repo, path, message: 'Apply final KL Real Estate premium homepage design', content: Buffer.from(html).toString('base64'), sha: r.data.sha, branch: 'main'});
            console.log('Premium homepage applied');
