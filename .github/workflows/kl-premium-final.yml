name: KL Real Estate Premium Final

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  premium:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply premium design
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '/* KL-PREMIUM-FINAL */'
          if marker in s:
              print('Premium design already applied')
              raise SystemExit(0)
          css = r'''<style>
          /* KL-PREMIUM-FINAL */
          :root{--kl-navy:#102b49;--kl-navy2:#071d35;--kl-gold:#c59a52;--kl-gold2:#e0bf7b;--kl-cream:#f7f3ea;--kl-blue:#eef3f8;--kl-line:#dfe5ec}
          body{background:#fff;color:#18304a;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
          header{background:rgba(255,255,255,.97);border-bottom:1px solid #e5e8ed;box-shadow:0 4px 24px rgba(8,31,55,.07)}
          .brand img{width:220px;height:68px}.links{gap:27px;color:var(--kl-navy)}.links a{transition:.2s}.links a:hover{color:var(--kl-gold)}
          .lang{border-color:#d9dfe7;color:var(--kl-navy);border-radius:24px;padding:10px 15px}.navbtn{background:linear-gradient(135deg,#a9792d,#d0a95f);border-radius:24px;padding:12px 20px;box-shadow:0 7px 18px rgba(176,130,48,.18)}
          .hero{padding:0;background:#fff;overflow:visible}.hero .container{max-width:none;padding:0}.hero-wrap{min-height:590px;border-radius:0;background-image:linear-gradient(90deg,rgba(255,255,255,.99) 0%,rgba(255,255,255,.94) 30%,rgba(255,255,255,.45) 58%,rgba(255,255,255,.05) 78%),url("hero.svg");background-size:cover;background-position:center;padding:78px max(7vw,32px);align-items:center}
          .hero-copy{max-width:720px}.eyebrow{color:var(--kl-gold);letter-spacing:2.2px}.eyebrow:before{background:var(--kl-gold)}.hero h1{font-family:Georgia,"Times New Roman",serif;color:var(--kl-navy2);font-size:clamp(46px,6vw,76px);letter-spacing:-3px}.hero h1 span{color:var(--kl-gold)}.hero p{color:#4e6075;font-size:18px;max-width:650px}
          .primary{background:linear-gradient(135deg,#ad7f32,#d0aa61);box-shadow:0 10px 25px rgba(173,127,50,.25);border-radius:28px;padding:14px 23px}.secondary{border-color:#d9e0e7;color:var(--kl-navy);border-radius:28px;padding:14px 23px}.hero-point{color:var(--kl-navy)}.hero-point b{color:var(--kl-gold)}
          .stats{margin-top:-36px}.stats-grid{border:1px solid #e0e5eb;border-top:4px solid var(--kl-gold);border-radius:18px;box-shadow:0 18px 48px rgba(12,39,67,.13)}.stat b{color:var(--kl-navy);font-family:Georgia,serif}.stat span{color:#68778a}
          .quick{background:linear-gradient(180deg,#fff,#f5f7fa);padding:40px 0 20px}.quick-btn{border-color:#e0e5eb;color:var(--kl-navy);border-radius:15px;box-shadow:0 7px 24px rgba(12,39,67,.06)}.quick-btn:nth-child(odd){background:#fbf7ef}.quick-btn:nth-child(even){background:#f1f5f9}.quick-btn:hover{border-color:var(--kl-gold)}
          .search{background:#fff}.searchbox{border-color:#dce3ea;box-shadow:0 16px 42px rgba(12,39,67,.11);border-radius:18px}.field select,.field input,.field textarea{border-color:#dce3ea}.field select:focus,.field input:focus,.field textarea:focus{border-color:var(--kl-gold);box-shadow:0 0 0 3px #f5ead5}
          section{padding:78px 0}.section-head h2{font-family:Georgia,"Times New Roman",serif;color:var(--kl-navy2);font-size:40px}.section-head p{color:#657589}.cards{grid-template-columns:repeat(3,1fr);gap:22px}.card{border-color:#e1e6ec;border-radius:19px;box-shadow:0 10px 32px rgba(15,40,65,.07)}.photo{height:220px}.tag{color:var(--kl-gold)}.price{color:var(--kl-navy);font-family:Georgia,serif}.featured-badge{background:#f7efdf;color:#8b672c}
          .category-band{background:linear-gradient(180deg,#fff,#f3f6f9)}.cat{background:#fff;border-color:#dfe5eb;border-radius:18px}.cat:nth-child(odd){background:#f6f8fa}.cat:nth-child(3){background:#fbf7ef}.cat .ico{background:#f5ead6;color:#9a702e}.cat strong{color:var(--kl-navy)}
          .about{background:linear-gradient(135deg,#f5f0e4,#edf3f8)}.about-card{border-radius:24px;box-shadow:0 14px 42px rgba(15,40,65,.08)}.check i{background:#f5ead6;color:#966d2e}
          .service-grid .service:nth-child(1),.service-grid .service:nth-child(4){background:#f7f1e5}.service-grid .service:nth-child(2),.service-grid .service:nth-child(5){background:#eef3f8}.service-grid .service:nth-child(3),.service-grid .service:nth-child(6){background:#fff}.service{border-color:#dfe5eb;border-radius:18px}.service .ico{color:var(--kl-gold)}
          .enquiry-layout{background:linear-gradient(135deg,#eef3f8,#fbf5e9);padding:30px;border-radius:26px}.form{border-radius:22px}.tracking{background:linear-gradient(135deg,#edf3f8,#f8f0e1);border-color:#dfe5eb}.admin-section{background:#f3f6f8}
          .contact{background:linear-gradient(135deg,#fff,#eef3f8)}.contact-info{background:linear-gradient(145deg,#071d35,#173b60);border-radius:24px}.contact-form{background:#fff;border-color:#dfe5eb}
          footer{background:linear-gradient(135deg,#071d35,#102b49 72%,#8a652d 150%)}footer h3{font-family:Georgia,serif}.bottom-actions{box-shadow:0 -4px 18px rgba(10,34,56,.10)}
          @media(max-width:1050px){.cards{grid-template-columns:1fr 1fr}.quick-grid{grid-template-columns:repeat(3,1fr)}}
          @media(max-width:650px){.brand img{width:180px}.hero-wrap{min-height:620px;padding:48px 25px;background-image:linear-gradient(180deg,rgba(255,255,255,.98),rgba(255,255,255,.80) 60%,rgba(255,255,255,.18)),url("hero.svg")}.hero h1{font-size:44px}.cards{grid-template-columns:1fr}.quick-grid{grid-template-columns:repeat(2,1fr)}}
          </style>'''
          s = s.replace('</head>', css + '\n</head>', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit premium design
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Apply final premium KL Real Estate design"
          git push
