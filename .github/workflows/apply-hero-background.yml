name: Apply AI Hero Background
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply hero styling
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if 'hero-bg-installed' in s:
              print('Hero background already installed')
              raise SystemExit(0)
          old='.hero{background:linear-gradient(110deg,#eff3ed,#f8f6ef 55%,#e8eee9);padding:72px 0 66px}'
          new='.hero{background-image:linear-gradient(90deg,rgba(10,35,28,.86),rgba(10,35,28,.28)),url("hero.svg");background-size:cover;background-position:center;position:relative;padding:72px 0 66px}/* hero-bg-installed */'
          if old not in s:
              raise SystemExit('Original hero style not found')
          s=s.replace(old,new,1)
          s=s.replace('.hero h1{font-size:', '.hero h1{color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.28);font-size:',1)
          s=s.replace('.hero p{font-size:18px;color:var(--muted);', '.hero p{font-size:18px;color:#f1f5f3;text-shadow:0 1px 8px rgba(0,0,0,.3);',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit homepage change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Add AI real estate hero background"
          git push