name: Apply KL Logo Color Theme
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  theme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply logo color backgrounds
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if 'logo-color-theme-v1' in s:
              print('Logo color theme already installed')
              raise SystemExit(0)
          marker='</style>'
          css='''\n/* logo-color-theme-v1: KL Real Estate brand palette */\nbody{background:#f4faf7}\n.hero{background:linear-gradient(180deg,#ffffff 0%,#e8f6ef 100%)}\n.stats-grid{border-top:4px solid #087f4f}\n.quick{background:linear-gradient(180deg,#e8f6ef 0%,#f7fbf9 100%)}\n.quick-btn:nth-child(1),.quick-btn:nth-child(4){background:#e8f6ef}\n.quick-btn:nth-child(2),.quick-btn:nth-child(5){background:#f5f9e9}\n.quick-btn:nth-child(3),.quick-btn:nth-child(6){background:#fff8e8}\n.search{background:#f7fbf9}\n.searchbox{border-color:#cfe8da;box-shadow:0 12px 35px rgba(7,59,42,.09)}\n.category-band{background:linear-gradient(180deg,#ffffff 0%,#edf8f2 100%)}\n.cat:nth-child(1),.cat:nth-child(4){background:#e8f6ef}\n.cat:nth-child(2),.cat:nth-child(5){background:#f4f9e9}\n.cat:nth-child(3){background:#fff9eb}\n.about{background:linear-gradient(135deg,#e3f5ec 0%,#f4f9e8 100%)}\n.service-grid .service:nth-child(1),.service-grid .service:nth-child(4){background:#e8f6ef}\n.service-grid .service:nth-child(2),.service-grid .service:nth-child(5){background:#f4f9e9}\n.service-grid .service:nth-child(3),.service-grid .service:nth-child(6){background:#fff9eb}\n.enquiry-layout{background:linear-gradient(135deg,#edf8f2,#fffaf0);padding:28px;border-radius:30px}\n.enquiry-layout .form{border-color:#cfe8da}\n.tracking{background:linear-gradient(135deg,#dff5e9,#f3f8df)}\n.admin-section{background:linear-gradient(180deg,#e9f6ef,#f4f8ed)}\n.contact{background:linear-gradient(135deg,#ffffff 0%,#edf8f2 100%)}\n.contact-form{background:#f5faf7}\nfooter{background:linear-gradient(135deg,#073b2a 0%,#087f4f 100%)}\n.logo-color-theme-v1{}\n'''
          if marker not in s:
              raise SystemExit('style marker not found')
          s=s.replace(marker,css+marker,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit theme
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Apply KL Real Estate logo color theme"
          git push
