name: Apply KL Real Estate Premium Theme

on:
  push:
    branches:
      - main

jobs:
  theme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply theme CSS
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '/* premium-kl-home-v3 */'
          if marker in s:
              print('Theme already applied')
              raise SystemExit(0)
          css = '''
/* premium-kl-home-v3 */
:root{--navy:#1c3150;--navy2:#0e2747;--gold:#c39a4b;--cream:#fbf8f1;--softgold:#f7f0df;--softblue:#eef3f8}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:#fff;color:#172a42}
header{background:rgba(255,255,255,.98);border-bottom:1px solid #e9edf1;box-shadow:0 3px 18px rgba(20,42,66,.06)}
.brand img{width:225px;height:68px;object-fit:contain}.links{gap:27px;color:var(--navy)}.links a:hover{color:var(--gold)}
.lang{border:1px solid #d8dee6;color:var(--navy);border-radius:28px;padding:10px 16px}.navbtn{background:linear-gradient(135deg,#a97d2e,#cda85d);color:#fff;border-radius:28px;padding:12px 20px;box-shadow:0 7px 18px rgba(181,139,53,.22)}
.hero{padding:0;background:#fff;overflow:visible}.hero .container{max-width:none;padding:0}
.hero-wrap{min-height:570px;border-radius:0;background-image:linear-gradient(90deg,rgba(255,255,255,.98) 0%,rgba(255,255,255,.91) 34%,rgba(255,255,255,.28) 63%,rgba(255,255,255,.04) 100%),url("hero.svg");background-size:cover;background-position:center;display:flex;align-items:center;padding:72px max(6vw,32px);position:relative}
.hero-copy{max-width:620px}.eyebrow{color:var(--gold);font-weight:900;letter-spacing:1.2px}.eyebrow:before{background:var(--gold);width:34px}
.hero h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(44px,5.5vw,70px);line-height:1.04;letter-spacing:-2px;color:var(--navy2);margin:18px 0}.hero h1 span{color:var(--gold)}.hero p{color:#40516a;font-size:18px;max-width:560px}
.primary{background:linear-gradient(135deg,#ad8030,#c9a45a);color:#fff;box-shadow:0 9px 22px rgba(173,128,48,.22)}.primary:hover{background:#9f7226}.secondary{background:#fff;border:1px solid #d8dee6;color:var(--navy)}
.hero-point{color:var(--navy)}.hero-point b{color:var(--gold);font-size:19px}
.stats{margin-top:-34px;position:relative;z-index:5}.stats-grid{background:#fff;border:1px solid #e1e6ec;border-top:4px solid var(--gold);box-shadow:0 18px 50px rgba(19,43,70,.12);border-radius:18px;padding:20px}.stat b{color:var(--navy);font-family:Georgia,serif}
.quick{padding:30px 0 18px;background:#fff}.quick-grid{grid-template-columns:repeat(6,1fr);gap:12px}.quick-btn{background:#fff;border:1px solid #e1e5eb;border-radius:14px;color:var(--navy);box-shadow:0 7px 22px rgba(18,45,72,.06)}.quick-btn:nth-child(odd){background:#fbf8f1}.quick-btn:nth-child(even){background:#f2f5f8}.quick-btn:hover{border-color:var(--gold);box-shadow:0 10px 26px rgba(18,45,72,.10)}
.search{padding:0 0 12px;background:#fff;position:relative;z-index:4}.searchbox{border:1px solid #dfe5eb;box-shadow:0 16px 38px rgba(17,42,70,.12);border-radius:18px;padding:15px;background:#fff}.field label{color:#667487}.field select,.field input,.field textarea{border-color:#dce2e9}.field select:focus,.field input:focus,.field textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px #f7eedc}.search .btn{min-width:145px}
section{padding:72px 0}.section-head h2{font-family:Georgia,"Times New Roman",serif;color:var(--navy2);font-size:39px}.section-head .eyebrow{color:var(--gold)}
.cards{grid-template-columns:repeat(4,1fr);gap:18px}.card{border:1px solid #e3e7ec;border-radius:18px;box-shadow:0 8px 28px rgba(18,45,72,.07)}.photo{height:190px;background-color:#edf2f6}.photo .photo-label{color:var(--navy);border:1px solid #eee2c8}.tag{color:var(--gold)}.price{color:var(--navy);font-family:Georgia,serif}.featured-badge{background:#f7efdf;color:#8f6828}
.category-band{background:linear-gradient(180deg,#fff 0%,#f7f9fb 100%)}.categories{grid-template-columns:repeat(5,1fr)}.cat{background:#fff;border:1px solid #e0e5eb;border-radius:16px;box-shadow:0 7px 24px rgba(18,45,72,.05)}.cat:nth-child(even){background:#f5f7fa}.cat:nth-child(3){background:#fbf7ee}.cat .ico{background:#f6eddb;color:var(--gold)}.cat strong{color:var(--navy)}
.about{background:linear-gradient(135deg,#f6f1e5 0%,#eef3f8 100%)}.about-card{border:1px solid #e0e4e8;background:rgba(255,255,255,.94);border-radius:24px}.check i{background:#f6eddb;color:#96702e}
.service-grid .service:nth-child(1),.service-grid .service:nth-child(4){background:#f7f1e3}.service-grid .service:nth-child(2),.service-grid .service:nth-child(5){background:#eef3f8}.service-grid .service:nth-child(3),.service-grid .service:nth-child(6){background:#fff}.service{border-color:#e0e5eb;border-radius:18px}.service .ico{color:var(--gold)}
.enquiry-layout{max-width:1050px;background:linear-gradient(135deg,#f4f7fa,#fbf5e8);padding:30px;border-radius:26px}.enquiry-layout .form{border-color:#e0e5eb}.form{border-radius:22px}.tracking{background:linear-gradient(135deg,#eef3f8,#f8f1e2);border:1px solid #e0e5eb}.admin-section{background:#f5f7f9}.admin-panel{border-color:#e0e5eb}
.contact{background:linear-gradient(135deg,#fff 0%,#f0f4f8 100%)}.contact-info{background:linear-gradient(145deg,#0e2747,#1c3150);border-radius:24px}.contact-form{background:#fff;border-color:#e0e5eb}
footer{background:linear-gradient(135deg,#0e2747 0%,#1c3150 72%,#8f6a2d 160%)}footer h3{font-family:Georgia,serif}.bottom-actions a:nth-child(2){background:var(--gold)}
@media(max-width:1050px){.cards{grid-template-columns:1fr 1fr}.quick-grid{grid-template-columns:repeat(3,1fr)}.categories{grid-template-columns:repeat(3,1fr)}}
@media(max-width:650px){.brand img{width:180px}.hero-wrap{min-height:610px;padding:45px 24px;background-image:linear-gradient(180deg,rgba(255,255,255,.97) 0%,rgba(255,255,255,.78) 57%,rgba(255,255,255,.18) 100%),url("hero.svg")}.hero h1{font-size:44px}.cards{grid-template-columns:1fr}.categories{grid-template-columns:1fr 1fr}.quick-grid{grid-template-columns:repeat(2,1fr)}}
'''
          s=s.replace('</style>', css+'\n</style>', 1)
          p.write_text(s,encoding='utf-8')
          print('Premium KL theme applied')
          PY
      - name: Commit theme
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Apply KL Real Estate premium homepage theme"
          git push
