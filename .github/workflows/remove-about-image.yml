name: Remove About Image
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove About section image
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<div class="about-photo"></div>','')
          s=s.replace('.about-grid{display:grid;grid-template-columns:1fr 1fr;gap:45px;align-items:center}', '.about-grid{display:grid;grid-template-columns:1fr;gap:30px;align-items:center}')
          s=s.replace('.about-photo{min-height:390px;border-radius:28px;background:linear-gradient(120deg,rgba(7,59,42,.05),rgba(7,59,42,.0)),url("hero.svg") center/cover;box-shadow:var(--shadow)}','')
          s=s.replace('.about-grid,.contact-grid{grid-template-columns:1fr}', '.contact-grid{grid-template-columns:1fr}')
          s=s.replace('.about-photo{min-height:260px}', '')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Remove unnecessary about section image"
          git push
