<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KL Real Estate | Add Property</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{margin:0;background:#f4f6f8;color:#102b49;font-family:Inter,system-ui,sans-serif}.wrap{max-width:680px;margin:24px auto;padding:0 14px}.card{background:#fff;border-radius:20px;padding:24px;box-shadow:0 12px 35px #102b4918}h1{font-family:Georgia,serif;margin:0 0 6px}.muted{color:#68778a}.field{margin:14px 0}.field label{display:block;font-weight:800;font-size:13px;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;box-sizing:border-box;padding:13px;border:1px solid #d9e0e7;border-radius:10px;font:inherit}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}.btn{border:0;border-radius:25px;padding:14px 22px;font-weight:800;cursor:pointer}.primary{background:#c59a52;color:#fff;width:100%}.msg{padding:12px;border-radius:10px;margin-top:14px;background:#eef7ee}.error{background:#fff0f0;color:#a12e2e}@media(max-width:600px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style></head><body><div class="wrap"><div class="card">
<h1>KL Real Estate</h1><p class="muted">Private Property Entry</p>
<div id="loginBox"><div class="field"><label>Email</label><input id="email" type="email" value="j.rajkumar1988@gmail.com"></div><div class="field"><label>Password</label><input id="password" type="password"></div><button class="btn primary" onclick="login()">Login</button><div id="loginMsg" class="msg" style="display:none"></div></div>
<div id="app" style="display:none"><form onsubmit="save(event)" class="grid">
<div class="field full"><label>Property Photo</label><input id="photo" type="file" accept="image/*" required></div>
<div class="field"><label>Property Type</label><select id="type"><option>Residential Plot</option><option>House</option><option>Apartment</option><option>Villa</option><option>Agricultural Land</option><option>Commercial Property</option><option>Industrial Property</option><option>Other</option></select></div>
<div class="field"><label>Purpose</label><select id="purpose"><option>Buy</option><option>Rent</option><option>Sell</option></select></div>
<div class="field"><label>District</label><input id="district" required></div><div class="field"><label>Location</label><input id="location" required></div>
<div class="field"><label>Area</label><input id="area" type="number" step="any"></div><div class="field"><label>Area Unit</label><select id="unit"><option>sq.ft</option><option>cent</option><option>acre</option><option>sq.m</option></select></div>
<div class="field"><label>Price</label><input id="price" placeholder="e.g. 25 lakh" required></div>
<div class="field"><label>Bedrooms</label><input id="bedrooms" type="number"></div><div class="field"><label>Bathrooms</label><input id="bathrooms" type="number"></div>
<div class="field full"><label>Description</label><textarea id="description" rows="4"></textarea></div>
<div class="field full"><label><input id="publish" type="checkbox" checked> Publish this property</label></div>
<div class="full"><button class="btn primary" type="submit">Publish Property</button></div><div id="msg" class="msg full" style="display:none"></div>
</form></div></div></div>
<script>
const db=supabase.createClient("https://xpbdskehqpfsxwvytwep.supabase.co","sb_publishable_2-_bvWESrhLA-dOeIZL_9g_7v4qY4zF");
function price(v){const r=String(v||"").toLowerCase().replace(/,/g,""),n=parseFloat(r.replace(/[^0-9.]/g,""));if(!Number.isFinite(n))return null;if(r.includes("crore")||r.includes("cr"))return n*1e7;if(r.includes("lakh")||r.includes("lac"))return n*1e5;return n}
async function login(){const m=document.getElementById("loginMsg");m.style.display="block";m.textContent="Signing in...";const{data,error}=await db.auth.signInWithPassword({email:document.getElementById("email").value.trim(),password:document.getElementById("password").value});if(error){m.className="msg error";m.textContent=error.message;return}if(data.session){document.getElementById("loginBox").style.display="none";document.getElementById("app").style.display="block"}}
async function save(e){e.preventDefault();const m=document.getElementById("msg");m.style.display="block";m.className="msg";m.textContent="Publishing...";try{const id="KL"+Date.now().toString().slice(-6),file=document.getElementById("photo").files[0],ext=(file.name.split(".").pop()||"jpg").toLowerCase().replace(/[^a-z0-9]/g,"")||"jpg",path=id+"-"+Date.now()+"."+ext;const up=await db.storage.from("property-images").upload(path,file,{upsert:true,contentType:file.type||"image/jpeg"});if(up.error)throw up.error;const image_url=db.storage.from("property-images").getPublicUrl(path).data.publicUrl;const payload={property_code:id,title:document.getElementById("type").value+" - "+document.getElementById("location").value.trim(),purpose:document.getElementById("purpose").value,property_type:document.getElementById("type").value,district:document.getElementById("district").value.trim(),location:document.getElementById("location").value.trim(),area:Number(document.getElementById("area").value)||null,area_unit:document.getElementById("unit").value,price:price(document.getElementById("price").value),bedrooms:Number(document.getElementById("bedrooms").value)||null,bathrooms:Number(document.getElementById("bathrooms").value)||null,status:"Available",description:document.getElementById("description").value.trim(),featured:document.getElementById("publish").checked,image_url};const{error}=await db.from("properties").insert(payload);if(error)throw error;m.textContent="✓ Published successfully. Property ID: "+id;e.target.reset();document.getElementById("publish").checked=true}catch(x){m.className="msg error";m.textContent="Error: "+x.message}}
db.auth.getSession().then(({data})=>{if(data.session){document.getElementById("loginBox").style.display="none";document.getElementById("app").style.display="block"}});
</script></body></html>
