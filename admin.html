<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KL Real Estate | Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f3f6f8;color:#102b49}.wrap{max-width:1100px;margin:40px auto;padding:0 18px}.panel{background:#fff;border:1px solid #dfe5eb;border-radius:22px;padding:28px;box-shadow:0 14px 40px #102b4918}h1,h2{font-family:Georgia,serif}.login{max-width:430px;margin:70px auto}.field{margin:14px 0}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;box-sizing:border-box;padding:12px;border:1px solid #d8e0e8;border-radius:10px;font:inherit}.btn{border:0;border-radius:24px;padding:12px 20px;font-weight:800;cursor:pointer}.primary{background:#c59a52;color:white}.secondary{background:#eef3f8;color:#102b49}.error{color:#a12e2e;background:#fff0f0}.msg{padding:12px;border-radius:10px;margin-top:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.full{grid-column:1/-1}.table{overflow:auto;margin-top:24px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:10px;border-bottom:1px solid #e3e8ed;white-space:nowrap}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.logout{color:#a12e2e}@media(max-width:650px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.wrap{margin:20px auto;padding:0 12px}.panel{padding:20px}}
</style></head><body>
<div class="wrap">
<div id="login" class="panel login"><h1>KL Real Estate</h1><h2>Admin Login</h2>
<form onsubmit="login(event)">
<div class="field"><label>Email</label><input id="email" type="email" autocomplete="username" required value="j rajkumar1988@gmail.com"></div>
<div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" required></div>
<button id="loginBtn" class="btn primary" type="submit">Login</button>
<button class="btn secondary" type="button" onclick="resetPassword()">Forgot password?</button>
<div id="msg" class="msg" style="display:none"></div></form></div>
<div id="app" class="panel" style="display:none">
<div class="top"><div><h1>Admin Dashboard</h1><p>Manage properties and enquiries.</p></div><button class="btn secondary logout" onclick="logout()">Logout</button></div>
<h2>Add Property</h2>
<form onsubmit="addProperty(event)" class="grid">
<div class="field"><label>Title</label><input id="title" required></div>
<div class="field"><label>Purpose</label><select id="purpose"><option>Buy</option><option>Rent</option><option>Sell</option></select></div>
<div class="field"><label>Property Type</label><select id="ptype"><option>Residential Plot</option><option>House</option><option>Apartment</option><option>Villa</option><option>Agricultural Land</option><option>Commercial Property</option><option>Industrial Property</option><option>Other</option></select></div>
<div class="field"><label>District</label><input id="district"></div><div class="field"><label>Location</label><input id="location"></div>
<div class="field"><label>Area</label><input id="area" type="number" step="any"></div><div class="field"><label>Area Unit</label><select id="unit"><option>sq.ft</option><option>cent</option><option>acre</option><option>sq.m</option></select></div>
<div class="field"><label>Price</label><input id="price" placeholder="e.g. 25 lakh"></div><div class="field"><label>Status</label><select id="status"><option>Available</option><option>Sold</option><option>Rented</option></select></div>
<div class="field"><label>Bedrooms</label><input id="bedrooms" type="number"></div><div class="field"><label>Bathrooms</label><input id="bathrooms" type="number"></div>
<div class="field full"><label>Description</label><textarea id="description"></textarea></div>
<div class="field full"><label>Property Photo</label><input id="photo" type="file" accept="image/*"><small style="display:block;margin-top:6px;color:#68778a">Upload a JPG, PNG or WebP photo.</small></div>
<div class="field"><label><input id="featured" type="checkbox" checked> Featured</label></div>
<div><button class="btn primary" type="submit">Add Property</button></div>
<div id="adminMsg" class="msg full" style="display:none"></div></form>
<h2>Properties</h2><div class="table"><table><thead><tr><th>Code</th><th>Title</th><th>Location</th><th>Area</th><th>Price</th><th>Status</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div>
<h2>Enquiries</h2><div class="table"><table><thead><tr><th>Date</th><th>ID</th><th>Customer</th><th>Requirement</th><th>Location</th><th>Status</th></tr></thead><tbody id="enqRows"></tbody></table></div>
</div></div>
<script>
const db=supabase.createClient("https://xpbdskehqpfsxwvytwep.supabase.co","sb_publishable_2-_bvWESrhLA-dOeIZL_9g_7v4qY4zF");
const $=id=>document.getElementById(id);
function price(v){const r=String(v||"").toLowerCase().replace(/,/g,"").trim(),n=parseFloat(r.replace(/[^0-9.]/g,""));if(!Number.isFinite(n))return null;if(r.includes("crore")||r.includes("cr"))return n*1e7;if(r.includes("lakh")||r.includes("lac"))return n*1e5;return n}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function area(v,u){return v?Number(v).toLocaleString("en-IN")+" "+(u||""):"-"}
async function login(e){e.preventDefault();$("msg").style.display="block";$("msg").className="msg";$("msg").textContent="Signing in...";$("loginBtn").disabled=true;try{const{data,error}=await db.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});if(error)throw error;if(!data.session)throw new Error("No active session was created.");$("login").style.display="none";$("app").style.display="block";await refresh()}catch(x){$("msg").className="msg error";$("msg").textContent=x.message||"Login failed."}finally{$("loginBtn").disabled=false}}
async function resetPassword(){const email=$("email").value.trim();if(!email){$("msg").style.display="block";$("msg").className="msg error";$("msg").textContent="Enter your email first.";return}const{error}=await db.auth.resetPasswordForEmail(email,{redirectTo:location.href});$("msg").style.display="block";$("msg").className=error?"msg error":"msg";$("msg").textContent=error?error.message:"Password reset email sent."}
async function logout(){await db.auth.signOut();location.reload()}
async function refresh(){await properties();await enquiries()}
async function properties(){const{data,error}=await db.from("properties").select("*").order("created_at",{ascending:false});$("rows").innerHTML=error?'<tr><td colspan="7">'+esc(error.message)+'</td></tr>':(data||[]).map(p=>'<tr><td>'+esc(p.property_code||String(p.id).slice(0,8))+'</td><td>'+esc(p.title)+'<br>'+esc(p.property_type)+'</td><td>'+esc([p.location,p.district].filter(Boolean).join(", "))+'</td><td>'+esc(area(p.area,p.area_unit))+'</td><td>'+esc(p.price??"-")+'</td><td>'+esc(p.status||"Available")+'</td><td><button class="btn secondary" onclick="feature(\''+p.id+'\','+(p.featured!==false)+')">'+(p.featured===false?"Feature":"Unfeature")+'</button> <button class="btn secondary" onclick="del(\''+p.id+'\')">Delete</button></td></tr>').join("")||'<tr><td colspan="7">No properties.</td></tr>'}
async function enquiries(){const{data,error}=await db.from("enquiries").select("*").order("created_at",{ascending:false});$("enqRows").innerHTML=error?'<tr><td colspan="6">'+esc(error.message)+'</td></tr>':(data||[]).map(e=>'<tr><td>'+new Date(e.created_at).toLocaleString("en-IN")+'</td><td>'+esc((String(e.notes||"").match(/Enquiry ID:\\s*([A-Z0-9-]+)/i)||[])[1]||"-")+'</td><td>'+esc(e.customer_name)+'<br>'+esc(e.phone)+'</td><td>'+esc(e.requirement_type)+'<br>'+esc(e.property_type)+'</td><td>'+esc([e.location,e.district].filter(Boolean).join(", "))+'</td><td><select onchange="status(\''+e.id+'\',this.value)">'+["NEW","CONTACTED","FOLLOW-UP","SITE VISIT","NEGOTIATION","CLOSED","NOT INTERESTED"].map(s=>'<option '+(e.status===s?"selected":"")+'>'+s+'</option>').join("")+'</select></td></tr>').join("")||'<tr><td colspan="6">No enquiries.</td></tr>'}
async function addProperty(e){e.preventDefault();const m=$("adminMsg");m.style.display="block";m.className="msg";m.textContent="Adding property...";try{const id="KL"+Date.now().toString().slice(-6);let image_url=null;const file=$("photo").files[0];if(file){const ext=(file.name.split(".").pop()||"jpg").toLowerCase().replace(/[^a-z0-9]/g,"")||"jpg";const path=id+"-"+Date.now()+"."+ext;const up=await db.storage.from("property-images").upload(path,file,{upsert:true,contentType:file.type||"image/jpeg"});if(up.error)throw up.error;image_url=db.storage.from("property-images").getPublicUrl(path).data.publicUrl}const payload={property_code:id,title:$("title").value.trim(),purpose:$("purpose").value,property_type:$("ptype").value,district:$("district").value.trim(),location:$("location").value.trim(),area:Number($("area").value),area_unit:$("unit").value,price:price($("price").value),bedrooms:$("bedrooms").value?Number($("bedrooms").value):null,bathrooms:$("bathrooms").value?Number($("bathrooms").value):null,status:$("status").value,description:$("description").value.trim(),featured:$("featured").checked,image_url:image_url};const{error}=await db.from("properties").insert(payload);if(error)throw error;m.className="msg";m.textContent="✓ Property "+id+" added successfully.";e.target.reset();$("featured").checked=true;await refresh()}catch(error){m.className="msg error";m.textContent="Error: "+(error.message||"Unable to add property.")}}
async function feature(id,current){const{error}=await db.from("properties").update({featured:!current}).eq("id",id);if(error)alert(error.message);else await refresh()}
async function del(id){if(!confirm("Delete this property?"))return;const{error}=await db.from("properties").delete().eq("id",id);if(error)alert(error.message);else await refresh()}
async function status(id,v){const{error}=await db.from("enquiries").update({status:v}).eq("id",id);if(error)alert(error.message)}
db.auth.getSession().then(({data})=>{if(data.session){$("login").style.display="none";$("app").style.display="block";refresh()}})
</script></body></html>
